name: KPI Deadline Alerts

# Checks every target company's deadline daily and sends an alert on D-14/D-7/D-1 while its
# competency-fill KPI is still behind target — runs from GitHub's cloud runners so it fires
# regardless of whether the laptop is on (see docs/adr/0001-storage-and-execution-architecture.md).
on:
  schedule:
    - cron: "0 23 * * *" # daily, 23:00 UTC ≈ 08:00 KST
  workflow_dispatch: {}

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Send deadline alerts
        run: npx tsx scripts/send-deadline-alerts.ts
        env:
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_GMAIL_CLIENT_ID: ${{ secrets.GOOGLE_GMAIL_CLIENT_ID }}
          GOOGLE_GMAIL_CLIENT_SECRET: ${{ secrets.GOOGLE_GMAIL_CLIENT_SECRET }}
          GOOGLE_GMAIL_REFRESH_TOKEN: ${{ secrets.GOOGLE_GMAIL_REFRESH_TOKEN }}
