name: KPI Quiz Inactivity Alert

# Checks daily whether 7+ days have passed since the last completed competency quiz and, if so,
# sends a nudge — runs from GitHub's cloud runners so it fires regardless of whether the laptop
# is on (see docs/adr/0001-storage-and-execution-architecture.md).
on:
  schedule:
    - cron: "0 23 * * *" # daily, 23:00 UTC ≈ 08:00 KST
  workflow_dispatch: {}

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Send quiz-inactivity alert
        run: npx tsx scripts/send-quiz-inactivity-alert.ts
        env:
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_GMAIL_CLIENT_ID: ${{ secrets.GOOGLE_GMAIL_CLIENT_ID }}
          GOOGLE_GMAIL_CLIENT_SECRET: ${{ secrets.GOOGLE_GMAIL_CLIENT_SECRET }}
          GOOGLE_GMAIL_REFRESH_TOKEN: ${{ secrets.GOOGLE_GMAIL_REFRESH_TOKEN }}
